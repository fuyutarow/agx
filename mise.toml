min_version = "2026.10.0"

[tools]
bun = "1.4.3"
rumdl = "0.2.78"
jj = "0.46.0"

# Host integrations are command authority, not versions provisioned by mise.
[vars]
"host_command:systemctl" = "Linux user-service status, cancellation and resource probes"
"host_command:systemd-run" = "Linux transient user-service worker launch"
"host_command:ps" = "Host process liveness and resource inspection"
"host_command:git" = "Temporary test repository initialization and commits"
"host_command:rip" = "Recoverable workspace removal and its integration fixtures"
"host_command:sleep" = "Shell fixture processes held alive for lock and lifecycle tests"
"host_command:/usr/bin/sandbox-exec" = "macOS kernel sandbox for read-only execution"
"host_command:lsof" = "Host open-file inspection before reference cleanup"
"host_command:fnox" = "Optional host secret-store lookup"
"host_command:stty" = "Terminal-mode fixtures for command help tests"
"host_command:claude" = "Host session inventory and message transport"
"host_command:codex" = "Host session inventory and message transport"

[tasks.setup]
alias = "i"
run = "bun install --frozen-lockfile"

[tasks.up]
alias = "u"
run = "bun update"

[tasks.fmt]
alias = "f"
depends = ["fmt:ts", "fmt:md"]

[tasks."fmt:ts"]
run = "bun x --bun --no-install oxfmt ."

[tasks."fmt:md"]
run = "rumdl fmt"

[tasks."fmt:check"]
run = "bun x --bun --no-install oxfmt --check ."

[tasks."fmt:staged"]
run = "bun tools/fmt-staged.ts --tool 'ts,js,json=bun x --bun --no-install oxfmt' --tool 'md=rumdl fmt'"

[tasks.lint]
alias = "l"
depends = ["lint:ts", "lint:all", "lint:md", "lint:changesets", "mise:contract"]

[tasks."lint:ts"]
run = "bun tools/lint-ts-candidate.ts"

[tasks."lint:all"]
run = "bun lint-oxlint.ts --type-aware"

[tasks."lint:md"]
run = "rumdl check"

[tasks."mise:contract"]
run = "bun tools/mise-contract.ts --tools --require-pinned --require-npm-lock"

[tasks.test]
alias = "t"
run = "bun test"

[tasks.check]
alias = "c"
depends = ["fmt:check", "lint", "test"]

[tasks."gate:land"]
depends = ["check"]

[tasks."hook:pre-commit"]
depends = ["fmt:staged", "lint:ts"]

[tasks.commit]
run = "bun tools/jj-commit.ts"

[tasks.push]
run = "bun tools/jj-push.ts"

[tasks.pull]
run = "jj git fetch --remote origin && jj rebase -b @ -d 'trunk()'"

[tasks."release:build"]
description = "Compile and archive one package at its own version"
run = "bun tools/release/build.ts"

[tasks.changeset]
description = "Record one package change without changing its version"
run = "bun tools/changeset/changeset.ts"

[tasks."release:version"]
description = "Apply one package's pending changesets and update its changelog"
run = "bun tools/changeset/apply.ts"

[tasks."lint:changesets"]
description = "Validate pending changesets and their package owners"
run = "bun tools/changeset/lint.ts"

[tasks."release:publish"]
description = "Preview one package release; --yes executes publication"
run = "bun tools/release/publish.ts"
