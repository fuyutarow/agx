name: Release
on:
  push:
    tags:
      - 'v[0-9]*'
      - 'usehooks-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (v<version> or usehooks-v<version>)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # The library builder deliberately invokes the pinned compiler offline.
      - run: bun x --bun --package typescript@6.0.3 tsc --version
      - name: Build, upload and verify release assets
        run: bun tools/release/ci.ts "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
