# dispatch-roster — the ONE home of the models a coordinator may dispatch work to.
#
# Every worker starts with `agx worker run <ticket>`; Jev selects a roster row from the ticket.
# The five commands are run, check, ls, judge and stats. The route says how the picked row runs:
#   route = "codex"  — bun tools/agx-worker/src/workers/codex.ts --choice <id>; Codex is the worker's own harness.
#   route = "claude" — claude -p through tools/agx-worker/src/workers/run-claude.ts.
# Agent, Task and Workflow tools dispatch nothing: the hook denies them and prints the table.
#
# CONFIGURATION CONTRACT: agents/models/dispatch-roster.contract.md.
# Numbers retain their sourced snapshot date; absent benchmark or price values are left out,
# never estimated. Per-effort AA Intelligence Index: artificialanalysis.ai/models/releases/<slug>.
# TB4 and SciCode are only retained where Artificial Analysis reports measurements for the row.
#   aa_index   Artificial Analysis Intelligence Index (2026-10-06)
#   tb4        Terminal-Bench 4.0, AA's own run (agentic terminal tasks), percent
#   scicode    SciCode, AA's own run (scientific code writing), percent
#   coding_agent  AA Coding Agent Index v1.5 (DeepSWE v1.1 + SWE-Atlas-QnA + Terminal-Bench v4)
#   price_in / price_cached_in / price_out  USD per 1M tokens, list price
#   codex model availability was probed on the CLI 2026-10-06; Claude rows accepted on CLI same date

schema = 1
as_of = "2026-10-08"
default = "luna-high"

# AUTO PICK — Jev sees each row.s published benchmark numbers and cost multiple.
# Hard routing contract: terminal-agentic and long-tool-loop require TB4 >= 30.0; timeout_s is
# passed as a task-size class.
[auto]
routes = ["codex"]
# What a 100% (exhausted, non-stale) subscription window does per route: "continue" dispatches and
# resumes anyway (Codex runs on purchased credits); "stop" vetoes the route. Real refusals still
# exclude a row through capacity cooldown. Contract: agents/models/dispatch-roster.contract.md.
on_window_exhausted = { codex = "continue", claude = "stop" }
max_task_chars = 6000
timeout_ms = 20000
no_egress = []
pick_temperature = 0.5

[auto.jev]
# Jev list price from archives/skills/driving-jev/references/model-and-api.md, verified 2026-09-21.
price_per_mtok_input = 0.042
price_per_mtok_output = 0.0
api = "typesafe"
url = "https://api.typesafe.ai/v1/systemone"
model = "jev-latest"

[claude_run]
max_budget_usd = 2.0
max_turns = 60
reason = "A worker task here cost 0.05-0.20 USD on luna; 20x is 1-4 USD, so 2 USD caps a run near the median at claude prices and turns an endless loop into a bounded failure."

[sources]
aa_releases = "https://artificialanalysis.ai/models/releases/"
aa_coding_agents = "https://artificialanalysis.ai/agents/coding-agents"
openai_pricing = "https://developers.openai.com/api/docs/pricing"
openai_terra_model = "https://developers.openai.com/api/docs/models/gpt-5.6-terra"
anthropic_pricing = "https://platform.claude.com/docs/en/about-claude/pricing"

